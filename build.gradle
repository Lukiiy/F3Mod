plugins {
    id 'java'
    id 'fabric-loom' version '1.19.3'
    id 'ploceus' version '1.19.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

base.archivesName = project.named
version = project.version
group = project.group

ploceus.setIntermediaryGeneration(2)

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraftVer}"
    modImplementation "net.fabricmc:fabric-loader:${project.loaderVer}"

    clientExceptions ploceus.raven(project.clientRaven, "client")
    serverExceptions ploceus.raven(project.serverRaven, "server")
    clientSignatures ploceus.sparrow(project.clientSparrow, "client")
    serverSignatures ploceus.sparrow(project.serverSparrow, "server")
    clientNests ploceus.nests(project.clientNests, "client")
    serverNests ploceus.nests(project.serverNests, "server")
    mappings ploceus.featherMappings(project.feather)

    ploceus.dependOsl(project.oslVer)
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}